=<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flashcards">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Flashcardsfromexcel</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --card-bg: #111111;
            --card-border: #333333;
            --btn-bg: #1a1a1a;
            --btn-hover: #2a2a2a;
            --accent-btn: #ffffff;
            --accent-btn-text: #000000;
        }

        html, body {
            height: 100%; margin: 0; padding: 0;
            background-color: var(--bg-color);
            overflow: hidden;
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            box-sizing: border-box;
            display: flex; flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            display: flex; flex-direction: column;
            width: 100%; 
            height: 100vh; 
            height: 100dvh;
            padding: env(safe-area-inset-top, 8px) 8px env(safe-area-inset-bottom, 8px) 8px;
            box-sizing: border-box; position: relative;
        }

        .card-counter-overlay {
            position: absolute; top: env(safe-area-inset-top, 12px); left: 50%;
            transform: translateX(-50%); background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(4px); color: #fff; padding: 4px 12px;
            border-radius: 12px; font-size: 0.85rem; font-weight: 600;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }

        .card-counter-overlay.visible { opacity: 1; }

        .scene {
            flex: 1 1 auto; width: 100%; max-width: 800px; margin: 0 auto 10px auto; 
            position: relative; perspective: 1000px;
            min-height: 0;
        }

        .card {
            width: 100%; height: 100%; position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden !important; -webkit-backface-visibility: hidden !important; 
            background-color: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 20px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .card-face.card-back { transform: rotateY(180deg); background-color: #0a0a0a; }

        .card-content-scroll {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            padding: 24px 16px; box-sizing: border-box;
            overflow-y: auto !important; -webkit-overflow-scrolling: touch !important;
            word-wrap: break-word; font-size: 2.5rem; font-weight: 500;
            text-align: center;
        }

        .text-centered-helper { display: block; width: 100%; margin: 0; padding: 0; }

        .card-content-scroll::-webkit-scrollbar { width: 6px; }
        .card-content-scroll::-webkit-scrollbar-track { background: transparent; }
        .card-content-scroll::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        .card-content-scroll iframe {
            width: 100%; height: 100%; border: none; background: transparent;
        }

        .card-content-scroll img {
            max-width: 100%; height: auto; max-height: 80vh; object-fit: contain;
            border-radius: 8px; display: block; margin: 0 auto;
            transition: transform 0.1s ease-out; transform-origin: center center;
        }

        .controls-container {
            display: flex; flex-direction: column; gap: 10px; align-items: center;
            width: 100%; max-width: 800px; margin: 0 auto; flex-shrink: 0;
            padding-bottom: env(safe-area-inset-bottom, 8px);
        }

        .controls { display: flex; gap: 8px; width: 100%; }

        button, .upload-btn {
            background-color: var(--btn-bg); color: var(--text-color);
            border: 1px solid var(--card-border); padding: 12px 14px;
            border-radius: 10px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease; flex: 1; text-align: center;
        }

        #btnFlip { background-color: var(--accent-btn); color: var(--accent-btn-text); flex: 1.5; }
        button:active, .upload-btn:active { transform: scale(0.96); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        input[type="file"] { display: none; }    
    </style>
</head>
<body>

    <div class="app-container" id="mainContainer">
        <div class="card-counter-overlay" id="counterOverlay"></div>

        <div class="scene">
            <div class="card" id="flashcard">
                <div class="card-face card-front">
                    <div class="card-content-scroll" id="cardFront">
                        <div class="text-centered-helper">Upload Excel to Start</div>
                    </div>
                </div>
                <div class="card-face card-back">
                    <div class="card-content-scroll" id="cardBack">
                        <div class="text-centered-helper"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls-container">
            <div class="controls">
                <button id="btnPrev" disabled>Prev</button>
                <button id="btnFlip" disabled>Flip Card</button>
                <button id="btnNext" disabled>Next</button>
            </div>
            <label class="upload-btn" id="uploadLabel" style="width: 100%; box-sizing: border-box;">
                Import Excel
                <input type="file" id="fileUpload" accept=".xlsx, .xls">
            </label>
        </div>
    </div>

    <script>
        let flashcards = [];
        let currentIndex = 0;
        let overlayTimeout;

        // Visual tracking properties
        let currentScale = 1;
        let currentPanX = 0;
        let currentPanY = 0;
        let lastKnownPlayerState = -1; 
        let lastKnownCurrentTime = 0;
        let ytLoopInterval = null;
        
        // Safety lock flag for managing ad transitions smoothly
        let adGracePeriod = false;

        const card = document.getElementById('flashcard');
        const cardFront = document.getElementById('cardFront');
        const cardBack = document.getElementById('cardBack');
        const btnPrev = document.getElementById('btnPrev');
        const btnFlip = document.getElementById('btnFlip');
        const btnNext = document.getElementById('btnNext');
        const fileUpload = document.getElementById('fileUpload');
        const counterOverlay = document.getElementById('counterOverlay');
        const uploadLabel = document.getElementById('uploadLabel');

        // Focus Reclaimer
        document.getElementById('mainContainer').addEventListener('click', () => {
            window.focus();
            if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
                document.activeElement.blur(); 
            }
        });

        function arrayBufferToBase64(buffer) {
            let binary = ''; const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
            return window.btoa(binary);
        }

        function compressImageURI(base64Str) {
            return new Promise((resolve) => {
                const img = new Image(); img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    let width = img.width, height = img.height;
                    if (width > height && width > 1200) { height *= 1200 / width; width = 1200; } 
                    else if (height > 1200) { width *= 1200 / height; height = 1200; }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.75));
                };
                img.onerror = () => resolve(base64Str);
            });
        }

        btnFlip.addEventListener('click', () => {
            if (flashcards.length > 0) { resetTransformations(); card.classList.toggle('is-flipped'); }
        });

        function showCounter() {
            counterOverlay.innerText = `${currentIndex + 1} / ${flashcards.length}`;
            counterOverlay.classList.add('visible');
            clearTimeout(overlayTimeout);
            overlayTimeout = setTimeout(() => { counterOverlay.classList.remove('visible'); }, 1000);
        }

        function adjustTypography(element, text) {
            if (!text) text = "";
            const helper = element.querySelector('.text-centered-helper');
            if (!helper) return; 
            
            helper.style.marginTop = "0px";
            const len = text.length;
            
            if (len > 300) { element.style.fontSize = "1.2rem"; element.style.textAlign = "left"; } 
            else if (len > 150) { element.style.fontSize = "1.5rem"; element.style.textAlign = "left"; } 
            else if (len > 50) {
                element.style.fontSize = "1.8rem"; element.style.textAlign = "center";
                if (element.clientHeight > helper.clientHeight) helper.style.marginTop = ((element.clientHeight - helper.clientHeight) / 2 - 24) + "px";
            } else {
                element.style.fontSize = "2.5rem"; element.style.textAlign = "center";
                if (element.clientHeight > helper.clientHeight) helper.style.marginTop = ((element.clientHeight - helper.clientHeight) / 2 - 24) + "px";
            }
        }

        function processContent(contentData) {
            if (!contentData) return "";
            let htmlOutput = "";

            if (contentData.text) {
                let text = contentData.text.trim();
                
                if (text.includes("drive.google.com")) {
                    let fileId = text.includes("/file/d/") ? text.split("/file/d/")[1].split("/")[0].split("?")[0] : (text.includes("id=") ? text.split("id=")[1].split("&")[0] : "");
                    if (fileId) htmlOutput += `<iframe id="gdEmbedPlayer" src="https://drive.google.com/file/d/${fileId}/preview" allowfullscreen></iframe>`;
                } 
                else if (text.includes("youtube.com") || text.includes("youtu.be")) {
                    let videoId = "", startTime = "0", endTime = "";
                    function convertToSeconds(rawTime) {
                        if (!rawTime) return "";
                        let cleaned = rawTime.replace(/s$/, "");
                        if (cleaned.includes('m') || cleaned.includes('h')) {
                            let hours = cleaned.match(/(\d+)h/), minutes = cleaned.match(/(\d+)m/), seconds = cleaned.match(/(\d+)s?$/);
                            let t = 0;
                            if (hours) t += parseInt(hours[1]) * 3600;
                            if (minutes) t += parseInt(minutes[1]) * 60;
                            if (seconds && !cleaned.endsWith('m') && !cleaned.endsWith('h')) t += parseInt(seconds[1]);
                            else if (cleaned.match(/m(\d+)$/)) t += parseInt(cleaned.match(/m(\d+)$/)[1]);
                            return t;
                        }
                        return cleaned;
                    }

                    if (text.includes("youtu.be/")) videoId = text.split("youtu.be/")[1].split(/[?#]/)[0];
                    else if (text.includes("embed/")) videoId = text.split("embed/")[1].split(/[?#]/)[0];
                    else if (text.includes("shorts/")) videoId = text.split("shorts/")[1].split(/[?#]/)[0];
                    else if (text.includes("v=")) videoId = text.split("v=")[1].split("&")[0].split(/[?#]/)[0];
                    
                    const startMatch = text.match(/[?&](?:t|start)=([^&]+)/); if (startMatch) startTime = convertToSeconds(startMatch[1]);
                    const endMatch = text.match(/[?&](?:end|stop)=([^&]+)/); if (endMatch) endTime = convertToSeconds(endMatch[1]);
                    
                    if (videoId) {
                        let embedUrl = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&start=${startTime}`;
                        if (endTime) embedUrl += `&end=${endTime}`;
                        htmlOutput += `<iframe id="ytPlayer" data-start="${startTime}" data-end="${endTime || ''}" src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                    } else {
                        htmlOutput += `<div class="text-centered-helper">${text}</div>`;
                    }
                } 
                else if (text.match(/\.(jpeg|jpg|gif|png|webp)$/i)) htmlOutput += `<img src="${text}">`;
                else htmlOutput += `<div class="text-centered-helper">${text}</div>`;
            }

            if (contentData.image) htmlOutput += `<img src="${contentData.image}" style="${contentData.text ? 'margin-top: 20px;' : ''}">`;
            return htmlOutput || `<div class="text-centered-helper"></div>`;
        }

        function applyGlobalTransform(target) {
            if (!target) return;
            if (currentScale < 1) { currentScale = 1; currentPanX = 0; currentPanY = 0; }
            target.style.transform = `translate(${currentPanX}px, ${currentPanY}px) scale(${currentScale})`;
        }

        function resetTransformations() {
            currentScale = 1; currentPanX = 0; currentPanY = 0;
            const activeFace = card.classList.contains('is-flipped') ? cardBack : cardFront;
            const mediaTarget = activeFace.querySelector('img') || activeFace.querySelector('#gdEmbedPlayer') || activeFace.querySelector('#ytPlayer');
            if (mediaTarget) applyGlobalTransform(mediaTarget);
        }

        function enableImagePanZoom(img) {
            img.style.transformOrigin = 'center';
            let startDistance = 0, startScale = 1, isPanning = false, startX = 0, startY = 0, lastTranslateX = 0, lastTranslateY = 0, lastTap = 0;

            img.addEventListener('touchstart', (e) => {
                const currentTime = new Date().getTime(); const tapLength = currentTime - lastTap;
                
                if (tapLength < 300 && tapLength > 0 && e.touches.length === 1) {
                    currentScale = currentScale > 1 ? 1 : 2.5; currentPanX = 0; currentPanY = 0;
                    img.style.transition = 'transform 0.3s ease-in-out'; applyGlobalTransform(img);
                    e.preventDefault();
                }
                lastTap = currentTime;

                if (e.touches.length === 2) {
                    e.preventDefault(); isPanning = false;
                    startDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                    startScale = currentScale; img.style.transition = 'none'; 
                } else if (e.touches.length === 1 && currentScale > 1) {
                    e.preventDefault(); isPanning = true;
                    startX = e.touches[0].pageX; startY = e.touches[0].pageY;
                    lastTranslateX = currentPanX; lastTranslateY = currentPanY;
                    img.style.transition = 'none';
                }
            }, { passive: false });

            img.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    currentScale = startScale * (Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY) / startDistance);
                    if (currentScale > 5) currentScale = 5; applyGlobalTransform(img);
                } else if (e.touches.length === 1 && isPanning && currentScale > 1) {
                    e.preventDefault();
                    currentPanX = lastTranslateX + (e.touches[0].pageX - startX);
                    currentPanY = lastTranslateY + (e.touches[0].pageY - startY); applyGlobalTransform(img);
                }
            }, { passive: false });

            img.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) img.style.transition = 'transform 0.2s ease-out';
                if (e.touches.length === 0) { isPanning = false; if (currentScale <= 1) resetTransformations(); }
            });
        }

        function updateUI() {
            if (flashcards.length === 0) return;
            card.classList.remove('is-flipped'); resetTransformations();

            setTimeout(() => {
                const currentCard = flashcards[currentIndex];
                cardFront.innerHTML = processContent(currentCard.front); cardBack.innerHTML = processContent(currentCard.back);
                adjustTypography(cardFront, currentCard.front.text); adjustTypography(cardBack, currentCard.back.text);
                cardFront.querySelectorAll('img').forEach(enableImagePanZoom); cardBack.querySelectorAll('img').forEach(enableImagePanZoom);
                cardFront.scrollTop = 0; cardBack.scrollTop = 0; showCounter();
                btnPrev.disabled = currentIndex === 0; btnNext.disabled = currentIndex === flashcards.length - 1; btnFlip.disabled = false;
                setTimeout(startYoutubeLoopWatcher, 100);
            }, 150);
        }

        btnPrev.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; updateUI(); } });
        btnNext.addEventListener('click', () => { if (currentIndex < flashcards.length - 1) { currentIndex++; updateUI(); } });

        function startYoutubeLoopWatcher() {
            if (ytLoopInterval) clearInterval(ytLoopInterval);
            ytLoopInterval = setInterval(() => {
                const activeFace = card.classList.contains('is-flipped') ? cardBack : cardFront;
                const ytPlayer = activeFace.querySelector('#ytPlayer');
                if (!ytPlayer) return;

                ytPlayer.contentWindow.postMessage(JSON.stringify({ event: 'listening' }), '*');
                ytPlayer.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'getCurrentTime' }), '*');
                ytPlayer.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'getPlayerState' }), '*');
            }, 500);
        }

        // =========================================================
        // FIXED LOGIC: Loops the video while fully allowing ads
        // =========================================================
        let isClearingGracePeriod = false; 

        window.addEventListener('message', (e) => {
            if (typeof e.origin === 'string' && e.origin.includes('youtube.com')) {
                try {
                    const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
                    if (data && data.event === 'infoDelivery' && data.info) {
                        const info = data.info;
                        
                        // 1. EXTENSIVE AD DETECTION
                        if (
                            info.adState === 1 || 
                            info.isAdPlaying === true || 
                            data.adState === 1 || 
                            (info.playerState === 3 && info.currentTime === undefined)
                        ) {
                            adGracePeriod = true; // Lock down safety flag
                            isClearingGracePeriod = false;
                            lastKnownCurrentTime = 0; // Prevent bad loop triggers from old data
                            return; // Bypass looping engine completely
                        }

                        // 2. AD EXIT GRACE CONTROLLER
                        if (adGracePeriod) {
                            const activeFace = card.classList.contains('is-flipped') ? cardBack : cardFront;
                            const ytPlayer = activeFace.querySelector('#ytPlayer');
                            let startSec = 0;
                            if (ytPlayer) {
                                startSec = parseInt(ytPlayer.getAttribute('data-start') || 0);
                            }

                            // Wait until video data is actually moving forward past start time constraints
                            if (info.currentTime !== undefined && info.currentTime >= startSec) {
                                if (!isClearingGracePeriod) {
                                    isClearingGracePeriod = true;
                                    setTimeout(() => {
                                        adGracePeriod = false; 
                                        isClearingGracePeriod = false;
                                    }, 1500); // 1.5s window to ensure playback stability
                                }
                            }
                            
                            // Synchronize time safely even during grace periods without loop testing
                            if (info.currentTime !== undefined) {
                                lastKnownCurrentTime = info.currentTime;
                            }
                            return; 
                        }

                        // 3. STATE SYNCHRONIZATION
                        if (info.currentTime !== undefined) {
                            lastKnownCurrentTime = info.currentTime;
                        }
                        if (info.playerState !== undefined) {
                            lastKnownPlayerState = info.playerState;
                        }

                        const activeFace = card.classList.contains('is-flipped') ? cardBack : cardFront;
                        const ytPlayer = activeFace.querySelector('#ytPlayer');
                        
                        if (ytPlayer && !adGracePeriod) {
                            const startSec = parseInt(ytPlayer.getAttribute('data-start') || 0);
                            const endSec = ytPlayer.getAttribute('data-end') ? parseInt(ytPlayer.getAttribute('data-end')) : null;
                            
                            const isVideoEnded = info.playerState === 0;
                            
                            // Ensure time is initialized before making sub-second logic boundaries
                            const isResetToZero = info.currentTime !== undefined && 
                                                  info.currentTime > 0.8 && 
                                                  info.currentTime < (startSec - 1);
                                                  
                            const isPastEndLimit = endSec && info.currentTime !== undefined && info.currentTime >= endSec;

                            // Loop execution trigger
                            if (isVideoEnded || isResetToZero || isPastEndLimit) {
                                // Clear stored parameters to prevent immediate loop execution upon refresh
                                lastKnownCurrentTime = startSec;
                                const originalSrc = ytPlayer.src;
                                ytPlayer.src = '';
                                ytPlayer.src = originalSrc;
                            }
                        }
                    }
                } catch (err) {}
            }
        });

        // =========================================================
        // KEYBOARD ENGINE
        // =========================================================
        window.addEventListener('keydown', (e) => {
            const activeFace = card.classList.contains('is-flipped') ? cardBack : cardFront;
            const ytPlayer = activeFace.querySelector('#ytPlayer');
            const zoomTarget = activeFace.querySelector('img') || activeFace.querySelector('#gdEmbedPlayer');

            const isAltOrCmd = e.altKey || e.metaKey;
            const isCtrl = e.ctrlKey;

            if (zoomTarget) {
                if (e.key === '+' || e.key === '=') {
                    e.preventDefault(); currentScale += 0.2; if (currentScale > 5) currentScale = 5;
                    zoomTarget.style.transition = 'transform 0.1s ease-out'; applyGlobalTransform(zoomTarget); return;
                }
                if (e.key === '-' || e.key === '_') {
                    e.preventDefault(); currentScale -= 0.2; if (currentScale < 1) { currentScale = 1; currentPanX = 0; currentPanY = 0; }
                    zoomTarget.style.transition = 'transform 0.1s ease-out'; applyGlobalTransform(zoomTarget); return;
                }

                if (currentScale > 1 && isAltOrCmd) {
                    const step = 25; e.preventDefault(); zoomTarget.style.transition = 'none';
                    if (e.key === 'ArrowUp') currentPanY -= step;
                    if (e.key === 'ArrowDown') currentPanY += step;
                    if (e.key === 'ArrowLeft') currentPanX -= step;
                    if (e.key === 'ArrowRight') currentPanX += step;
                    applyGlobalTransform(zoomTarget); return;
                }
            }

            if (isCtrl) {
                const scrollStep = 40;
                if (e.key === 'ArrowUp') { e.preventDefault(); activeFace.scrollTop -= scrollStep; return; }
                if (e.key === 'ArrowDown') { e.preventDefault(); activeFace.scrollTop += scrollStep; return; }
            }

            if (!isAltOrCmd && !isCtrl) {
                if (e.key === 'ArrowLeft' && ytPlayer) {
                    e.preventDefault();
                    let seekPos = Math.max(0, lastKnownCurrentTime - 10);
                    ytPlayer.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'seekTo', args: [seekPos, true] }), '*');
                    lastKnownCurrentTime = seekPos; 
                    return;
                }
                if (e.key === 'ArrowRight' && ytPlayer) {
                    e.preventDefault();
                    let seekPos = lastKnownCurrentTime + 10;
                    ytPlayer.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'seekTo', args: [seekPos, true] }), '*');
                    lastKnownCurrentTime = seekPos; 
                    return;
                }
            }

            if (!isAltOrCmd && !isCtrl) {
                if (e.key === 'ArrowUp') { e.preventDefault(); if (!btnPrev.disabled) btnPrev.click(); return; }
                if (e.key === 'ArrowDown') { e.preventDefault(); if (!btnNext.disabled) btnNext.click(); return; }
                if (e.key === 'Enter') { e.preventDefault(); if (!btnFlip.disabled) btnFlip.click(); return; }

                if (e.code === 'Space' || e.key === ' ') {
                    if (ytPlayer) {
                        e.preventDefault();
                        if (lastKnownPlayerState === 1) ytPlayer.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'pauseVideo', args: [] }), '*');
                        else ytPlayer.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'playVideo', args: [] }), '*');
                    }
                    return;
                }
            }
        });

        function applyTouchScrolling(element) {
            let startY = 0, currentScrollTop = 0;
            element.addEventListener('touchstart', (e) => { startY = e.touches[0].pageY; currentScrollTop = element.scrollTop; }, { passive: true });
            element.addEventListener('touchmove', (e) => { if (currentScale === 1) element.scrollTop = currentScrollTop + (startY - e.touches[0].pageY); }, { passive: true });
        }
        applyTouchScrolling(cardFront); applyTouchScrolling(cardBack);

        fileUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0]; if (!file) return;
            uploadLabel.innerText = "Reading Excel data..."; uploadLabel.style.pointerEvents = "none";
            cardFront.innerHTML = '<div class="text-centered-helper">Reading Excel data...</div>';

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = e.target.result; const workbook = new ExcelJS.Workbook(); await workbook.xlsx.load(data);
                    const worksheet = workbook.worksheets[0]; flashcards = []; const rowDataMap = new Map();

                    worksheet.eachRow((row, rowNumber) => {
                        const rowIndex = rowNumber - 1, frontText = row.getCell(1).text || "", backText = row.getCell(2).text || "";
                        if (frontText.trim() || backText.trim()) rowDataMap.set(rowIndex, { frontText: frontText.trim(), frontImage: null, backText: backText.trim(), backImage: null });
                    });

                    const images = worksheet.getImages(); let processedCount = 0;
                    for (const image of images) {
                        processedCount++; uploadLabel.innerText = `Optimizing image ${processedCount} of ${images.length}...`;
                        const rowIndex = Math.floor(image.range.tl.row), colIndex = Math.floor(image.range.tl.col); 
                        const imgData = workbook.getImage(image.imageId);
                        
                        if (imgData) {
                            const rawUri = `data:image/${imgData.extension};base64,${arrayBufferToBase64(imgData.buffer)}`;
                            const optimizedUri = await compressImageURI(rawUri);
                            if (!rowDataMap.has(rowIndex)) rowDataMap.set(rowIndex, { frontText: "", frontImage: null, backText: "", backImage: null });
                            const cardData = rowDataMap.get(rowIndex);
                            if (colIndex === 0) cardData.frontImage = optimizedUri; else if (colIndex === 1) cardData.backImage = optimizedUri;
                        }
                    }

                    const sortedIndices = Array.from(rowDataMap.keys()).sort((a, b) => a - b);
                    sortedIndices.forEach(idx => {
                        const data = rowDataMap.get(idx);
                        if (data.frontText || data.frontImage || data.backText || data.backImage) flashcards.push({ front: { text: data.frontText, image: data.frontImage }, back: { text: data.backText, image: data.backImage } });
                    });

                    if (flashcards.length > 0) {
                        uploadLabel.style.display = 'none'; currentIndex = 0; updateUI();
                    } else {
                        cardFront.innerHTML = '<div class="text-centered-helper">No data found in Excel</div>';
                        uploadLabel.innerText = "Import Excel"; uploadLabel.style.pointerEvents = "auto"; showCounter(); btnFlip.disabled = true;
                    }
                } catch(err) {
                    cardFront.innerHTML = '<div class="text-centered-helper">Error reading file structure.</div>';
                    uploadLabel.innerText = "Import Excel"; uploadLabel.style.pointerEvents = "auto";
                }
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
