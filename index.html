<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Flashcards">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    
    <link rel="manifest" href='data:application/manifest+json;charset=utf-8,{"name":"Minimal Flashcards","short_name":"Flashcards","display":"standalone","background_color":"#000000","theme_color":"#000000","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"192\" height=\"192\" style=\"background:%23000\"></svg>","sizes":"192x192","type":"image/png"}]}'>
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='192' height='192' style='background:%23000'></svg>">
    
    <title>Minimal Flashcards</title>
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --card-bg: #111111;
            --card-border: #333333;
            --btn-bg: #1a1a1a;
            --btn-hover: #2a2a2a;
            --accent-btn: #ffffff;
            --accent-btn-text: #000000;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        body {
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            height: -webkit-fill-available;
            padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
            box-sizing: border-box;
        }

        .scene {
            flex: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 20px auto;
            position: relative;
            min-height: 0;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden; 
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .card-content-scroll {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 32px 24px;
            box-sizing: border-box;
            overflow-y: scroll !important;
            -webkit-overflow-scrolling: touch !important;
            word-wrap: break-word;
            word-break: break-word;
            font-size: 2.5rem;
            font-weight: 500;
            line-height: 1.4;
            display: block;
            text-align: center;
            
            /* Stops the annoying highlighting markers from locking up gestures */
            user-select: none !important;
            -webkit-user-select: none !important;
            touch-action: none !important; /* Passes touch mechanics directly to our JS engine */
        }

        .text-centered-helper {
            display: block;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .card-content-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .card-content-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .card-content-scroll::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }

        .card-face.card-back {
            transform: rotateY(180deg);
            background-color: #0a0a0a;
        }

        .card-content-scroll iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        .card-content-scroll img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            flex-shrink: 0;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 100%;
            justify-content: space-between;
        }

        button, .upload-btn {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            flex: 1;
            text-align: center;
        }

        #btnFlip {
            background-color: var(--accent-btn);
            color: var(--accent-btn-text);
            border: 1px solid var(--accent-btn);
            flex: 1.5;
        }

        button:active, .upload-btn:active {
            transform: scale(0.96);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        input[type="file"] {
            display: none;
        }

        .status {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="scene">
            <div class="card" id="flashcard">
                <div class="card-face card-front">
                    <div class="card-content-scroll" id="cardFront">
                        <div class="text-centered-helper">Upload Excel to Start</div>
                    </div>
                </div>
                <div class="card-face card-back">
                    <div class="card-content-scroll" id="cardBack">
                        <div class="text-centered-helper"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls-container">
            <div class="controls">
                <button id="btnPrev" disabled>Prev</button>
                <button id="btnFlip" disabled>Flip Card</button>
                <button id="btnNext" disabled>Next</button>
            </div>
            
            <label class="upload-btn" style="width: 100%; box-sizing: border-box;">
                Import Excel
                <input type="file" id="fileUpload" accept=".xlsx, .xls">
            </label>
            
            <div class="status" id="statusText">No cards loaded</div>
        </div>
    </div>

    <script>
        let flashcards = [];
        let currentIndex = 0;

        const card = document.getElementById('flashcard');
        const cardFront = document.getElementById('cardFront');
        const cardBack = document.getElementById('cardBack');
        const btnPrev = document.getElementById('btnPrev');
        const btnFlip = document.getElementById('btnFlip');
        const btnNext = document.getElementById('btnNext');
        const fileUpload = document.getElementById('fileUpload');
        const statusText = document.getElementById('statusText');

        btnFlip.addEventListener('click', () => {
            if (flashcards.length > 0) {
                card.classList.toggle('is-flipped');
            }
        });

        function adjustTypography(element, text) {
            const len = text.length;
            const helper = element.querySelector('.text-centered-helper');
            
            if (helper) {
                helper.style.marginTop = "0px";
            }
            
            if (len > 300) {
                element.style.fontSize = "1.2rem";
                element.style.textAlign = "left";
            } else if (len > 150) {
                element.style.fontSize = "1.5rem";
                element.style.textAlign = "left";
            } else if (len > 50) {
                element.style.fontSize = "1.8rem";
                element.style.textAlign = "center";
                if (helper && element.clientHeight > helper.clientHeight) {
                    helper.style.marginTop = ((element.clientHeight - helper.clientHeight) / 2 - 32) + "px";
                }
            } else {
                element.style.fontSize = "2.5rem";
                element.style.textAlign = "center";
                if (helper && element.clientHeight > helper.clientHeight) {
                    helper.style.marginTop = ((element.clientHeight - helper.clientHeight) / 2 - 32) + "px";
                }
            }
        }

        function processContent(content) {
            if (content === undefined || content === null) return "";
            
            let text = String(content).trim();

            if (text.includes("drive.google.com")) {
                let fileId = "";
                if (text.includes("/file/d/")) {
                    fileId = text.split("/file/d/")[1].split("/")[0].split("?")[0];
                } else if (text.includes("id=")) {
                    fileId = text.split("id=")[1].split("&")[0];
                }
                if (fileId) {
                    return `<iframe src="https://drive.google.com/file/d/${fileId}/preview" allow="autoplay"></iframe>`;
                }
            }

            if (text.match(/\.(jpeg|jpg|gif|png|webp)$/i) || text.startsWith('http')) {
                if (text.startsWith('http')) {
                    return `<img src="${text}" alt="Flashcard Image">`;
                }
            }

            return `<div class="text-centered-helper">${text}</div>`;
        }

        function updateUI() {
            if (flashcards.length === 0) return;

            card.classList.remove('is-flipped');

            setTimeout(() => {
                const currentCard = flashcards[currentIndex];
                
                cardFront.innerHTML = processContent(currentCard.front);
                cardBack.innerHTML = processContent(currentCard.back);
                
                adjustTypography(cardFront, currentCard.front);
                adjustTypography(cardBack, currentCard.back);

                cardFront.scrollTop = 0;
                cardBack.scrollTop = 0;

                statusText.innerText = `Card ${currentIndex + 1} of ${flashcards.length}`;
                
                btnPrev.disabled = currentIndex === 0;
                btnNext.disabled = currentIndex === flashcards.length - 1;
                btnFlip.disabled = false;
            }, 150);
        }

        btnPrev.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateUI();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateUI();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

            const activeFace = card.classList.contains('is-flipped') ? cardBack : cardFront;

            switch(e.key) {
                case 'ArrowLeft':
                    if (!btnPrev.disabled) btnPrev.click();
                    break;
                case 'ArrowRight':
                    if (!btnNext.disabled) btnNext.click();
                    break;
                case 'Enter':
                    if (!btnFlip.disabled) btnFlip.click();
                    break;
                case 'ArrowUp':
                    activeFace.scrollBy({ top: -60, behavior: 'smooth' });
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    activeFace.scrollBy({ top: 60, behavior: 'smooth' });
                    e.preventDefault();
                    break;
            }
        });

        // Hardened Touch Drag Scroll Injector Engine
        function applyTouchScrolling(element) {
            let startY = 0;
            let currentScrollTop = 0;

            element.addEventListener('touchstart', (e) => {
                startY = e.touches[0].pageY;
                currentScrollTop = element.scrollTop;
            }, { passive: true });

            element.addEventListener('touchmove', (e) => {
                const moveY = e.touches[0].pageY;
                // Calculate physical movement offset distance
                const diffY = startY - moveY;
                
                // Directly scroll element viewport by movement delta
                element.scrollTop = currentScrollTop + diffY;
            }, { passive: true });
        }

        // Apply manually to both card sides
        applyTouchScrolling(cardFront);
        applyTouchScrolling(cardBack);

        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                flashcards = [];
                
                rows.forEach(row => {
                    const frontData = row[0];
                    const backData = row[1];
                    
                    if (frontData || backData) {
                        flashcards.push({
                            front: frontData || " ", 
                            back: backData || " "
                        });
                    }
                });

                if (flashcards.length > 0) {
                    currentIndex = 0;
                    updateUI();
                } else {
                    cardFront.innerHTML = '<div class="text-centered-helper">No data found in Excel</div>';
                    statusText.innerText = "Error: Blank sheet";
                    btnFlip.disabled = true;
                }
            };

            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
